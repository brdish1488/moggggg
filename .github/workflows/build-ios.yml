name: Build iPhone IPA
on:
  push:
    branches: [main]
    paths:
      - 'main.swift'
      - 'build-ios.sh'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 device app (no paid Apple account)
        run: bash build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CircleTap-IPA
          path: build/CircleTap.ipa
          if-no-files-found: error
          retention-days: 3
